name: GitHub Pagesへ公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: ファイルを取得
        uses: actions/checkout@v6

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: GitHub Pagesを準備
        uses: actions/configure-pages@v5

      - name: 必要な部品を準備
        run: npm ci

      - name: 公開用ファイルを作成
        run: npm run build

      - name: 公開用ファイルを受け渡す
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
